<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Crypto Newsletter</title>
  <style>
    body { font-family: sans-serif; margin: 2em; }
    #coins { margin-top: 1em; }
    .error { color: red; }
  </style>
</head>
<body>
  <h1>Crypto Newsletter</h1>
  <p>This page lists trending cryptocurrencies from CoinGecko.</p>
  <p><strong>Disclaimer:</strong> The information on this site is purely speculative and does not constitute financial advice.</p>
  <h2>Trending Coins</h2>
  <ul id="coins">
    <li>Loading...</li>
  </ul>
  <script>
    async function fetchTrending() {
      try {
        const resp = await fetch('https://api.coingecko.com/api/v3/search/trending');
        if (!resp.ok) throw new Error('Network response was not ok');
        const data = await resp.json();
        const listEl = document.getElementById('coins');
        listEl.innerHTML = '';
        if (Array.isArray(data.coins)) {
          data.coins.forEach(entry => {
            const item = entry.item || {};
            const li = document.createElement('li');
            li.textContent = `${item.market_cap_rank}: ${item.name} (${item.symbol})`;
            listEl.appendChild(li);
          });
        } else {
          listEl.innerHTML = '<li>No data available.</li>';
        }
      } catch (err) {
        document.getElementById('coins').innerHTML = '<li class="error">Failed to load data.</li>';
      }
    }
    fetchTrending();
  </script>
</body>
</html>
